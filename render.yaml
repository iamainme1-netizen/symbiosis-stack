services:
  - type: web
    name: symbiosis-api
    env: docker
    plan: free
    region: oregon
    envVars:
      - key: AWS_KMS_MOCK_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: symbiosis-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: symbiosis-redis
          property: connectionString

  - type: keyvalue
    name: symbiosis-redis
    region: oregon
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all traffic

databases:
  - name: symbiosis-postgres
    databaseName: symbiosis_ledger
    user: symbiosis_user
    region: oregon
    plan: free

